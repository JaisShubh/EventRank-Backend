name: Backend API checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postman-api-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/eventrank?directConnection=true
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
      QR_SECRET: ci-only-qr-secret-not-for-production-0987654321
      QR_WINDOW_SECONDS: 60
      EARLY_CHECKIN_MINUTES: 60
      VENUE_RADIUS_METERS: 100
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh

      - name: Start API
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run Postman API collection
        run: postman collection run ./postman/EventRank.postman_collection.json --no-report-events

      - name: Show API logs on failure
        if: failure()
        run: cat server.log
